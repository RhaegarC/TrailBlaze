name: Create and publish a Docker image

on:
  push:
    branches:
      - master
    paths:
      - 'src/api/**'

env:
  REGISTRY: ghcr.io
  AZURE_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Convert repository name to lowercase
        id: vars
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}api' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=ghcr.io/$(echo '${{ github.repository }}api' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/api
          file: ./src/api/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
