name: tb-stage

services:
  azure-sql-edge:
    image: mcr.microsoft.com/azure-sql-edge
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - tb-stage-mssql-data:/var/opt/mssql
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  azure-storage-edge:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite", "-l", "/data", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - tb-stage-azurite-data:/data
    environment:
      AZURITE_ACCOUNTS: "tbtestaccount:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: tb-migrate:local
    depends_on:
      azure-sql-edge:
        condition: service_healthy
    environment:
      DbConnection: "Server=azure-sql-edge,1433;Database=TrailBlaze;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in src/api/.env};Encrypt=True;TrustServerCertificate=True"
      ASPNETCORE_ENVIRONMENT: Production
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          if /app/efbundle; then exit 0; fi
          echo "migrate: attempt $$attempt failed; retrying in 5s" >&2
          sleep 5
        done
        echo "migrate: gave up after 30 attempts" >&2
        exit 1
    restart: "no"

  blob-init:
    image: mcr.microsoft.com/azure-cli:2.89.1
    depends_on:
      azure-storage-edge:
        condition: service_healthy
    environment:
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=tbtestaccount;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azure-storage-edge:10000/tbtestaccount;"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for container in covers avatars media; do
          az storage container create -n $$container --only-show-errors || exit 1
        done
        echo "blob-init: covers, avatars and media are present"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tb-api:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      blob-init:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  tb-stage-mssql-data:
    name: tb-stage-mssql-data
  tb-stage-azurite-data:
    name: tb-stage-azurite-data
