name: trailblaze-tests

# The host ports are variables, read from the same names by TestEnvironment.cs so the two cannot drift.
# `docker-compose.yml` owns 1433 and 10000 regardless.
services:
  azure-sql-edge:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: azure-sql-edge
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in src/api/.env}"
    ports:
      - "127.0.0.1:${TB_TEST_SQL_PORT:-14330}:1433"
    shm_size: 1gb

  azure-storage-edge:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: azure-storage-edge
    command: ["azurite", "-l", "/data", "--blobHost", "0.0.0.0"]
    ports:
      - "127.0.0.1:${TB_TEST_BLOB_PORT:-10010}:10000"
