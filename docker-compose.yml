# Local run: the API, against a real Azure SQL Database (PRD "Deployment (stage 1)").
#
# There is deliberately **no database service** here. Azure SQL Database is a managed service with
# no container image, and development runs against a real one rather than a stand-in — so the local
# stack is the API and nothing else, and `DbConnection` below points at Azure. Running the container
# therefore needs outbound network access, not a `depends_on` on a database that is not there.
#
# Credentials come from the environment, never from this file (STANDARD §6). Copy `.env.example`
# to `.env` and fill it in; compose reads `.env` automatically.
#
#   cp .env.example .env    # then edit it
#   docker compose up --build
#
# Migrations are applied by the API at startup, so a new database is brought up to schema by simply
# starting the API — see DatabaseMigrationService.
#
# Two things Azure SQL needs that a local server did not:
#   * the server's firewall must allow the connection — add the client IP you are connecting from
#   * Azure SQL only speaks TLS, so the connection string carries `Encrypt=True` and does **not**
#     set `TrustServerCertificate=True` (there is no self-signed certificate to accept)

services:
  api:
    build:
      context: src/api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      # Supplied whole from `.env` rather than assembled here: the connection string is the
      # deployment's business, and a value the app never sees in pieces is a value it cannot
      # silently get wrong. Azure's own copy-paste string is what belongs here.
      DbConnection: "${DB_CONNECTION:?Set DB_CONNECTION in .env — see .env.example}"
      BlobConnection: "${BLOB_CONNECTION:?Set BLOB_CONNECTION in .env — see .env.example}"
      # Comma-separated (STANDARD §9); the API fails at startup if this is empty.
      AllowedOrigins: "${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}"
    ports:
      - "8080:8080"
    restart: unless-stopped
